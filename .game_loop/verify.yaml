# WHAT MUST BE RUN WHEN A THING CHANGES.
#
# The rule this encodes: if a change has an OUTPUT that is not the thing you edited — a code
# generator, template, migration, schema, serializer, IaC, build script — no verification counts
# until the output's real consumer has consumed it. A generator's own test comparing emitted text to
# emitted text, an analyzer configured to exclude the output dir, a downstream that exercises none of
# the changed code: three green signals, all vacuous, none lying.
#
# FORMAT:  <glob>: [<command>, ...]   — commands run from the repo root.
# A `<glob>/**` entry matches anything under that directory.
# The commands must FAIL when the change is broken. A command that cannot fail is not a check.
#
# COVERAGE — a map of listed paths defaults to OWES-NOTHING, and a path nobody listed passes
# `verify --check` in perfect silence (issue #25: a whole package built, hand-tested and committed
# while the gate reported clean). So coverage is computed the other way round: every changed path is
# UNCHECKED until a rule claims it or this file excludes it out loud. Ask at any time:
#
#     ./.game_loop/bin/verify --coverage        (and `game_loop status` re-prints it every session)
#
# The one reserved key. Its entries are GLOBS, not commands — paths that genuinely need no check:
#
# "unchecked-ok":
#   - "docs/**"
#
# Excluding is a stated decision that stays visible here and is counted in every report. Leaving
# something UNCHECKED is fine too — it just says so out loud on every commit that touches it.
# Being unchecked never BLOCKS a commit: this file ships empty, so "unlisted ⇒ refused" would
# refuse a fresh install's first commit with the fix sitting behind the gate (INV5). A project that
# wants the hard version opts in with a catch-all rule:  "*": ["<command>"].
#
# What INSTALLS into your project ships EMPTY (see templates/verify.yaml): game_loop does not know your
# project, so `verify` and the commit gate are no-ops until you add rules. Examples (delete and replace):
#
# "src/**":
#   - "npm test"
#   - "npm run lint"
#
# "schema/*.sql":
#   - "./scripts/apply-migrations.sh --dry-run"

# THIS repo's own rules (NOT shipped to installs): game_loop dogfoods itself — the gates are the
# product, so a change to any of them owes the test suite.
".game_loop/bin/game_loop":
  - "python3 test/run.py"
".game_loop/bin/watchdog":
  - "python3 test/run.py"
".game_loop/bin/guard-writes.sh":
  - "python3 test/run.py"
".game_loop/bin/guard-writes-impl.sh":
  - "python3 test/run.py"
".game_loop/bin/guard-mcp.sh":
  - "python3 test/run.py"
".game_loop/bin/guard-mcp-impl.sh":
  - "python3 test/run.py"
".game_loop/bin/verify":
  - "python3 test/run.py"
".game_loop/bin/flair.py":
  - "python3 test/run.py"
".game_loop/bin/notify.py":
  - "python3 test/run.py"
# The suite IS the guarantee, and the manifest decides what a change owes: both are gates, so both
# owe the suite. Named because `verify --coverage` reported them unchecked — the report working.
"test/run.py":
  - "python3 test/run.py"
# The sweep decides whether the suite's silence-shaped assertions are worth anything (#42), and it
# now FAILS a run rather than only printing. Its verdict line and its list of producers are checked
# by the suite — cheaply, without running the sweep, which is one full pass per producer.
"test/mutation_sweep.py":
  - "python3 test/run.py"
# The claims record is DATA the tool reads and ships, like behaviour.json — and a malformed one
# degrades to silence: external_claims_report returns nothing and status simply stops mentioning the
# host, which looks exactly like a harness with no external claims to make. That is the failure this
# repo keeps paying for, so the shipped file owes the suite too. The suite also holds the
# default-deny that ties each entry to its LEDGER heading, so editing either without the other fails.
# A change to what game_loop REFUSES owes an entry in the behaviour record, or an explicit decision
# that nobody would notice. The mechanism existed and the discipline lapsed silently — twelve
# refusal-touching commits after the record's only entry, four of them qualifying — so it is a gate
# now rather than a habit. It fires only when a refusal LINE moves, not on every edit.
".game_loop/bin/guard-writes-impl.sh":
  - "python3 test/behaviour_gate.py"
".game_loop/bin/guard-mcp-impl.sh":
  - "python3 test/behaviour_gate.py"
"test/behaviour_gate.py":
  - "python3 test/run.py"
".game_loop/behaviour.json":
  - "python3 test/run.py"
# The probe is executable code that spends the human's tokens and writes the snapshot three gates
# read. It owes the suite like every other script here.
".game_loop/bin/limit-probe.sh":
  - "python3 test/run.py"
".game_loop/claims.json":
  - "python3 test/run.py"
".game_loop/LEDGER.md":
  - "python3 test/run.py"
".game_loop/verify.yaml":
  - "python3 test/run.py"
# install.sh was deliberately unlisted while it only copied files — nothing could fail. It now DECIDES
# something (issue #30: adopt a linked worktree's project rules, or refuse), and a wrong decision
# there hands a tree a harness that gates nothing. That is behaviour, the suite drives the real
# installer through its real interface, so it owes the suite like every other gate.
"install.sh":
  - "python3 test/run.py"
# The behaviour record is DATA the update notice reads, and a malformed one degrades to silence --
# the notice would report nothing and look exactly like an install with nothing to report. That is
# the failure class this repo keeps paying for, so the shipped file owes the suite too.
".game_loop/behaviour.json":
  - "python3 test/run.py"

# THE TWO DOCUMENTS A CONSUMER OPERATES FROM. Added after editing both and being told "nothing
# changed that owes a check" -- while test/run.py asserts, over every tracked file, that the house
# word appears nowhere. A doc edit really can fail the suite, so it owes the suite. Only these two:
# gating a LICENSE edit on a three-minute run is the kind of tax that gets a rule deleted rather
# than obeyed, and these are the ones that actually change.
"README.md":
  - "python3 test/run.py"
"llms.txt":
  - "python3 test/run.py"
# THE ONE TRACKED FILE WHOSE CONTENTS EXECUTE IN SOMEBODY ELSE'S CHECKOUT. It sat in unchecked-ok
# under "covered for exactly one property -- the house word", which was true until this repo grew
# assertions about what is IN it: no home-anchored path, every hook anchored to $CLAUDE_PROJECT_DIR.
# A home path here was reported once, the installer was fixed, and nothing stopped it returning.
# Third entry in that list found stale today; the list is right and its membership goes out of date.
".claude/settings.json":
  - "python3 test/run.py"

# Deliberately unchecked for their CONTENT, and it stays visible here. Prose, licence text, editor
# config and the payload copied verbatim into other projects: no command exists that fails when what
# they SAY is wrong.
#
# NOT "no command exists" full stop, which is what this said until it was read carefully. Every
# tracked file here is covered for exactly one property -- the house word -- because that scan runs
# over the whole repo (#33). The sentence was true when written and stopped being when the scan was
# widened, which is why it now names the property rather than claiming an absence.
"unchecked-ok":
  - "*.md"
  - "docs/**"
  - "templates/**"
  - "LICENSE"
  - ".gitignore"
  # .claude/settings.json is NOT here -- it has its own rule above. The rest of .claude/ is local
  # session wiring nobody else runs.
  - ".claude/agents/**"
  - ".claude/skills/**"
  - ".game_loop/*.md"
  - ".game_loop/config.json"
  - ".game_loop/notify.json"
