# WHAT MUST BE RUN WHEN A THING CHANGES.
#
# The rule this encodes: if a change has an OUTPUT that is not the thing you edited — a code
# generator, template, migration, schema, serializer, IaC, build script — no verification counts
# until the output's real consumer has consumed it. A generator's own test comparing emitted text to
# emitted text, an analyzer configured to exclude the output dir, a downstream that exercises none of
# the changed code: three green signals, all vacuous, none lying.
#
# FORMAT:  <glob>: [<command>, ...]   — commands run from the repo root.
# A `<glob>/**` entry matches anything under that directory.
# The commands must FAIL when the change is broken. A command that cannot fail is not a check.
#
# COVERAGE — a map of listed paths defaults to OWES-NOTHING, and a path nobody listed passes
# `verify --check` in perfect silence (issue #25: a whole package built, hand-tested and committed
# while the gate reported clean). So coverage is computed the other way round: every changed path is
# UNCHECKED until a rule claims it or this file excludes it out loud. Ask at any time:
#
#     ./.game_loop/bin/verify --coverage        (and `game_loop status` re-prints it every session)
#
# The one reserved key. Its entries are GLOBS, not commands — paths that genuinely need no check:
#
# "unchecked-ok":
#   - "docs/**"
#
# Excluding is a stated decision that stays visible here and is counted in every report. Leaving
# something UNCHECKED is fine too — it just says so out loud on every commit that touches it.
# Being unchecked never BLOCKS a commit: this file ships empty, so "unlisted ⇒ refused" would
# refuse a fresh install's first commit with the fix sitting behind the gate (INV5). A project that
# wants the hard version opts in with a catch-all rule:  "*": ["<command>"].
#
# What INSTALLS into your project ships EMPTY (see templates/verify.yaml): game_loop does not know your
# project, so `verify` and the commit gate are no-ops until you add rules. Examples (delete and replace):
#
# "src/**":
#   - "npm test"
#   - "npm run lint"
#
# "schema/*.sql":
#   - "./scripts/apply-migrations.sh --dry-run"

# THIS repo's own rules (NOT shipped to installs): game_loop dogfoods itself — the gates are the
# product, so a change to any of them owes the test suite.
# THE ONES THAT KEEP THE WHOLE SUITE, AND THE COUNT THAT SAYS WHY. Every other rule below names
# sections instead; these were measured the same way and the number came back too close to 1605 to
# be worth the hand-maintained list, or the file is one a subset cannot honestly cover:
#
#   bin/game_loop     the 9k-line core, reached by nearly every section. A subset here would be
#                     dishonest rather than fast.
#   test/run.py       the suite itself, and the selector inside it. A subset of the thing deciding
#                     what a subset means is circular.
#   bin/watchdog      30 sections mention it. Selecting them costs the shared-fixture prefix twice
#                     over and lands within noise of the full run.
#   bin/verify        8 sections RUN it, one of them near the end of the fixture block -- so the
#                     prefix rule alone pulls in that whole block, and pinned dispatch adds 300 more.
#   install.sh        29 sections. It is the widest file here after the core.
#   the two SHIMS     guard-writes.sh and guard-mcp.sh are 23 and 19 lines, and every write-guard
#                     test reaches the impl THROUGH the shim (`guard()` invokes the shim, not the
#                     impl). So a shim owes its impl's sections PLUS the pin-dispatch and
#                     central-install sections that are about the shim's own job -- roughly 1000 of
#                     1605. Rarely edited, structurally load-bearing, and INV5's fail-closed path:
#                     the wrong file to buy two minutes on.
#
# These are decisions, not omissions, and each is re-checkable with `--list-sections`.
# THE FILES THAT KEEP THE WHOLE SUITE RUN IT IN PARALLEL. `test/prun.py` shards the suite's
# own top-level sections across processes using the SAME `--section` selector the rules below use,
# so it inherits the soundness this manifest already depends on rather than inventing its own.
# Measured 2026-08-25 on 14 cores: 292s serial -> 103s, and a change to bin/game_loop went from a
# 286-second verify to about 100. It is `--verify`-able against a serial run, and was: 1719 outcomes
# both ways, 0 absent, 0 extra, 0 differing. That check earned itself immediately — the first
# sharding lost ten assertions while reporting MORE outcomes than the suite has.
#
# EIGHT OF THESE BECAME FOUR. (The header above said SEVEN and there were eight — install.sh joined
# the list later and the count was never re-read. Counted here rather than inherited.)
# bin/verify, bin/watchdog and the two guard shims kept the whole-suite
# rule out of caution rather than out of measurement, and a four-minute wait on every commit is the
# kind of tax that gets a rule deleted rather than obeyed -- which is the same argument the
# sectioned rules further down were already written from. Each now names the sections that are
# ABOUT it, and says what that skips.
#
# THE FOUR THAT KEEP IT, and why the argument does not reach them: bin/game_loop and _gl_impl.py
# are the door and the room of the tool ITSELF, so nearly every section is about them and a list
# would be the whole list with a staleness risk attached. test/run.py is the suite, which owes the
# whole of itself. install.sh decides what a tree's harness is, and a wrong decision there hands
# somebody a harness that gates nothing.
#
# The SECTIONED rules below are untouched: they were already the surgical path and already fast.
".game_loop/bin/game_loop":
  - "python3 test/prun.py"
# THE DOOR AND THE ROOM BOTH OWE THE SUITE. bin/game_loop is now a ~30-line stub that imports
# _gl_impl.py, which is where the 10k lines actually live — so a rule that named only the stub would
# stop firing on the file that changes. Speed bought with a gate that no longer gates is not a
# trade this manifest makes; both are listed, and the stub is listed FIRST so a reader meets the
# entry point where they expect it.
".game_loop/bin/_gl_impl.py":
  - "python3 test/prun.py"
# WHAT THIS SKIPS: `--section` closes over section NAMES, not over the filesystem, so a section
# that drives the watchdog without saying "watchdog" anywhere in its title is not selected here. The
# substring `watchdog` alone reaches eleven of them — per-session isolation, the three slack
# forwarding cases, the supersede and handover stand-downs, the pid-provenance rule, the exhausted
# park, both readable seams, and the suite's own bound on the reply poll — and the closure pulls in
# whatever those read a name from. `slack paging` is named anyway because the forwarding cases run
# against its fake server, and a fixture reached only through the closure is one edit away from not
# being reached at all.
".game_loop/bin/watchdog":
  - "python3 test/run.py --section 'house voice' --section watchdog --section 'slack paging' --section 'session GC' --section 'every executable in bin/' --section 'guard nothing calls' --section 'pinned dispatch'"
# THE DOOR GETS THE ROOM'S RULE. guard-writes.sh is a 23-line shim that resolves a binary and
# execs guard-writes-impl.sh, so what it can break is what the impl's own sections already drive --
# and giving the door a WIDER rule than the room would be gating the thin file harder than the
# thick one. Identical list, deliberately: if the impl's coverage moves, both move together.
".game_loop/bin/guard-writes.sh":
  - "python3 test/run.py --section 'write guard' --section deploy --section 'authorize recurrence' --section 'unreadable commit target' --section 'unharnessed tree' --section 'POLICY is not the' --section 'EMBEDDED in the shell guards' --section 'guard nothing calls' --section 'config paths' --section 'pinned dispatch'"
  - "python3 test/behaviour_gate.py"
# A SMALLER COMMAND THAN "EVERYTHING", AND WHAT IT COSTS. These two files are edited often and
# each edit used to gate on all 1596 checks -- 5:19, nearly all of it about code the change did not
# touch. That is the kind of tax that gets a rule deleted rather than obeyed, so the rule names the
# sections that are ABOUT these files instead.
#
# WHAT THIS SKIPS, said out loud because a subset gates on less than the whole: any section whose
# NAME does not match the patterns below but which exercises these guards anyway. `--section` closes
# over names, not over the filesystem, and it cannot know that some unnamed section calls guard().
# The list was read off `--list-sections` by hand, so it goes out of date the way every hand list
# does -- if you add a guard section, add it here or it stops gating this file.
#
# The behaviour gate still runs in full: it is seconds, and it is the one that notices a REFUSAL
# changing without a record entry.
".game_loop/bin/guard-writes-impl.sh":
  - "python3 test/run.py --section 'write guard' --section deploy --section 'authorize recurrence' --section 'unreadable commit target' --section 'unharnessed tree' --section "POLICY is not the session's" --section 'EMBEDDED in the shell guards' --section 'guard nothing calls' --section 'config paths'"
  - "python3 test/behaviour_gate.py"
# The same argument as guard-writes.sh above: a 19-line shim in front of guard-mcp-impl.sh.
".game_loop/bin/guard-mcp.sh":
  - "python3 test/run.py --section 'MCP guard' --section 'MCP writes' --section 'guard nothing calls' --section 'EMBEDDED in the shell guards' --section 'pinned dispatch'"
  - "python3 test/behaviour_gate.py"
".game_loop/bin/guard-mcp-impl.sh":
  - "python3 test/run.py --section 'MCP guard' --section 'MCP writes' --section 'guard nothing calls' --section 'EMBEDDED in the shell guards'"
  - "python3 test/behaviour_gate.py"
# WHAT THIS SKIPS: same closure-over-names caveat as every sectioned rule here. `commit` reaches
# the eight sections that drive the gate itself (repo scoping, chained work, blast radius, the tree
# a commit lands in, what the commit CARRIES, provenance by ref, an unreadable target, an
# unharnessed tree); `coverage` reaches the manifest's own report and its --staged form; `worktree`
# and `pinned` reach the two ways this binary can be pointed at a tree that is not the one being
# committed. A section that exercises verify under a title naming none of those words is not
# covered, and the list was read off `--list-sections` by hand, so it goes stale the way every hand
# list does.
".game_loop/bin/verify":
  - "python3 test/run.py --section 'house voice' --section commit --section coverage --section worktree --section 'pinned harness' --section 'pinned dispatch' --section 'write guard' --section 'every executable in bin/' --section 'guard nothing calls'"
# WHAT THIS SKIPS: the sections that name flair are the flair section itself, the default-deny over
# what bin/ ships, and the orphan scan that would notice nothing calling it. A caller that renders a
# banner without the word "flair" anywhere in its section name is not covered here. 178 checks, 37s.
".game_loop/bin/flair.py":
  - "python3 test/run.py --section 'house voice' --section flair --section 'every executable in bin/' --section 'guard nothing calls'"
# WHAT THIS SKIPS: notify is reached from the paging path, the user-level config fallback, the
# watchdog's three forwarding cases and the session GC, and every one of those names itself. What it
# does NOT cover is a caller that sends without saying so in its section name — the reply POLL, for
# one, is asserted in "the suite cannot hang on the watchdog's reply poll" and is deliberately not
# selected, because that section is about the suite's own bound rather than about notify's behaviour.
# 453 checks, 63s.
".game_loop/bin/notify.py":
  - "python3 test/run.py --section 'house voice' --section 'slack paging' --section 'notify config falls back' --section 'watchdog forwards' --section 'slack-paged arm survives' --section 'session GC' --section 'every executable in bin/' --section 'guard nothing calls' --section 'site config has a gitignored home' --section 'silently not run is worse' --section 'pinned dispatch'"
# The suite IS the guarantee, and the manifest decides what a change owes: both are gates, so both
# owe a check. Named because `verify --coverage` reported them unchecked — the report working. Only
# the suite owes the WHOLE of itself; the manifest's own rule names a section, further down.
"test/run.py":
  - "python3 test/prun.py"
# THE TRIPWIRE'S OWN CALIBRATION (#119). test/suite-floor.json sets the number the coverage gate
# compares against, and it matched no rule here — so the one file where "nothing looked at it"
# matters most could be edited owing nothing. Observed five times in a single day (156399d, 0932cee,
# 1051688, and the coverage reports on 8c630ef and 35c8321), every one printing NOT CHECKED.
# WHAT THIS BUYS, STATED HONESTLY BECAUSE IT IS HALF: a floor written too HIGH now goes red, because
# prun refuses a floor above the run. A floor written too LOW still passes green and silent, and low
# is the direction someone editing this file is tempted to move it. That half is not fixable by
# naming a command here — it needs the floor compared against the file's own recorded measurements,
# which is a check nobody has an observed failure for yet (INV4). This closes "owes nothing"; it
# does not close "wrong in the quiet direction", and the difference is worth knowing.
"test/suite-floor.json":
  - "python3 test/prun.py"
# The sweep decides whether the suite's silence-shaped assertions are worth anything (#42), and it
# now FAILS a run rather than only printing. Its verdict line and its list of producers are checked
# by the suite — cheaply, without running the sweep, which is one full pass per producer.
# WHAT THIS SKIPS: the sweep's verdicts, its default-deny over the producers it can find, its
# working-tree restore, and the wording rule over its exclusions all name themselves. What is NOT
# covered is the sweep as it is actually RUN — one full pass per producer, which nothing in the
# suite does and no rule here could afford. That was already true of the full-suite command this
# replaces. 68 checks, 7s.
"test/mutation_sweep.py":
  - "python3 test/run.py --section 'house voice' --section 'producer mutation sweep' --section 'sweep cannot strand a mutation' --section 'mutation sweep coverage' --section 'exclusion cannot become invisible' --section 'guard nothing calls'"
# The claims record is DATA the tool reads and ships, like behaviour.json — and a malformed one
# degrades to silence: external_claims_report returns nothing and status simply stops mentioning the
# host, which looks exactly like a harness with no external claims to make. That is the failure this
# repo keeps paying for, so the shipped file owes a check too. The suite holds the default-deny
# that ties each entry to its LEDGER heading, so editing either without the other fails -- and that
# is the section the rule below names, rather than all 1605 checks.
# A change to what game_loop REFUSES owes an entry in the behaviour record, or an explicit decision
# that nobody would notice. The mechanism existed and the discipline lapsed silently — twelve
# refusal-touching commits after the record's only entry, four of them qualifying — so it is a gate
# now rather than a habit. It fires only when a refusal LINE moves, not on every edit.
# The behaviour_gate command for the two impl scripts is listed with them in the bin block above,
# NOT repeated here. It used to be declared a second time at this spot, and a repeated key silently
# discarded the earlier `python3 test/run.py` rule -- so the write guard owed the suite on paper and
# owed nothing in fact. verify now MERGES a repeated key and says so out loud; this file should not
# need that mercy.
# WHAT THIS SKIPS: the gate has exactly one section about it, and the coverage section's mention of
# the STRING "test/behaviour_gate.py" is an assertion about verify.yaml's contents, not about this
# file — so it belongs to the manifest's rule below and not to this one. 10 checks, 1s.
"test/behaviour_gate.py":
  - "python3 test/run.py --section 'house voice' --section 'behaviour gate'"
# WHAT THIS SKIPS: three sections read the shipped record — the update notice that renders it, the
# contract a consumer pins to, and the gate that refuses an unrecorded refusal. A fourth reader that
# named itself something else would not be selected. 208 checks, 44s.
".game_loop/behaviour.json":
  - "python3 test/run.py --section 'house voice' --section 'update check' --section 'behaviour record is a contract' --section 'behaviour gate'"
# The probe is executable code that spends the human's tokens and writes the snapshot three gates
# read. It owes a check like every other script here.
# WHAT THIS SKIPS: the probe writes a snapshot three gates READ, so the limit gate sections are
# selected alongside the probe's own. Not covered: a reader of that snapshot whose section name says
# neither "limit gate" nor "limit probe" — the watchdog's usage park is one, and it keeps its cover
# through the watchdog rule below, which still owes the whole suite. 162 checks, 32s.
".game_loop/bin/limit-probe.sh":
  - "python3 test/run.py --section 'house voice' --section 'the limit probe' --section 'every executable in bin/' --section 'limit gate'"
# ONE COMMAND FOR BOTH, so a commit editing a claim and its LEDGER heading — which is the only way
# either is supposed to be edited — runs it once rather than twice. The default-deny that ties each
# claims.json entry to a real LEDGER heading is the check that matters, and it reads both files.
# WHAT THIS SKIPS: any other reader of either file. 33 checks, 4s — the cheapest rule here.
".game_loop/claims.json":
  - "python3 test/run.py --section 'house voice' --section 'claim about the HOST'"
".game_loop/LEDGER.md":
  - "python3 test/run.py --section 'house voice' --section 'claim about the HOST'"
# THE MANIFEST GATES ITSELF. The coverage section is the one that reads THIS file and asserts about
# it: no path declared twice, and the write guard's impl still owing both of its commands. It sits
# deep in the shared-fixture block, so selecting it costs that block's whole prefix — 479 of 1605
# checks, 96s. Half the suite to edit a rule is still half of what it was.
# WHAT THIS SKIPS: everything after the fixture block that reads no rule of this file.
".game_loop/verify.yaml":
  - "python3 test/run.py --section 'house voice' --section 'what the checks manifest is NOT looking at'"
# install.sh was deliberately unlisted while it only copied files — nothing could fail. It now DECIDES
# something (issue #30: adopt a linked worktree's project rules, or refuse), and a wrong decision
# there hands a tree a harness that gates nothing. That is behaviour, the suite drives the real
# installer through its real interface, so it owes the suite like every other gate.
# THE NIGHTLY SWEEP'S WORKFLOW. What can break here is not the YAML failing loudly -- it is the
# matrix and the shard denominator drifting apart, which sweeps a fraction of the producers while
# every shard that ran reports clean. That is a partial run speaking in the whole run's voice, the
# failure this repo names most often, and no shard failing is exactly why nothing else would catch
# it. Seconds, and it is the only rule here that gates a file GitHub runs rather than one we do.
".github/workflows/*.yml":
  - "python3 test/run.py --section 'nightly sweep workflow' --section 'house voice'"
"install.sh":
  - "python3 test/prun.py"
# The behaviour record is DATA the update notice reads, and a malformed one degrades to silence --

# THE TWO DOCUMENTS A CONSUMER OPERATES FROM. Added after editing both and being told "nothing
# changed that owes a check" -- while test/run.py asserts, over every tracked file, that the house
# word appears nowhere. A doc edit really can fail the suite, so it owes that scan. Only these two:
# gating a LICENSE edit on a three-minute run is the kind of tax that gets a rule deleted rather
# than obeyed, and these are the ones that actually change.
# ONE COMMAND FOR BOTH. They are the two files the CLI-option assertion reads as a single body of
# text, and they are edited together; a shared command means a commit touching both pays for it once.
# The union is over-gating for either one alone -- llms.txt does not define the shell function -- and
# over-gating is the safe direction, unlike the other kind of imprecision this file can have.
# WHAT THIS SKIPS: the whole shared-fixture block, which reads neither file. 317 checks, 43s.
"README.md":
  - "python3 test/run.py --section 'house voice' --section 'shell function two shipped files' --section 'moment nobody can find' --section 'arrived blind' --section 'pinned dispatch'"
"llms.txt":
  - "python3 test/run.py --section 'house voice' --section 'shell function two shipped files' --section 'moment nobody can find' --section 'arrived blind' --section 'pinned dispatch'"
# THE ONE TRACKED FILE WHOSE CONTENTS EXECUTE IN SOMEBODY ELSE'S CHECKOUT. It sat in unchecked-ok
# under "covered for exactly one property -- the house word", which was true until this repo grew
# assertions about what is IN it: no home-anchored path, every hook anchored to $CLAUDE_PROJECT_DIR.
# A home path here was reported once, the installer was fixed, and nothing stopped it returning.
# Third entry in that list found stale today; the list is right and its membership goes out of date.
# WHAT THIS SKIPS: four sections read this repo's own settings.json -- the mcp__.* registration, the
# statusline tap's absence notice, the no-home-anchored-path scan, and pinned dispatch's assertion
# that every hook goes through the pin check. The first of those is inside the shared-fixture block,
# so this rule pays that block's prefix: 676 of 1605 checks, 125s. It is the most expensive rule
# below the full suite, and it is still less than half of one.
".claude/settings.json":
  - "python3 test/run.py --section 'house voice' --section 'MCP guard (wired in' --section 'statusline tap announces its own absence' --section 'one tracked file whose contents EXECUTE' --section 'pinned dispatch'"

# Deliberately unchecked for their CONTENT, and it stays visible here. Prose, licence text, editor
# config and the payload copied verbatim into other projects: no command exists that fails when what
# they SAY is wrong.
#
# NOT "no command exists" full stop, which is what this said until it was read carefully. Every
# tracked file here is covered for exactly one property -- the house word -- because that scan runs
# over the whole repo (#33). The sentence was true when written and stopped being when the scan was
# widened, which is why it now names the property rather than claiming an absence.
"unchecked-ok":
  - "*.md"
  - "docs/**"
  - "templates/**"
  - "LICENSE"
  - ".gitignore"
  # .claude/settings.json is NOT here -- it has its own rule above. The rest of .claude/ is local
  # session wiring nobody else runs.
  - ".claude/agents/**"
  - ".claude/skills/**"
  - ".game_loop/*.md"
  - ".game_loop/config.json"
  - ".game_loop/notify.json"
  # saggar's own project manifest, written by `saggar init` and by the app. It is that tool's file,
  # not this repo's: nothing here reads it, and no command exists that fails when its contents are
  # wrong. `successor` detects saggar from SAGGAR_SESSION in the environment and never opens this,
  # so the coverage report should say "excluded on purpose" rather than "nobody checked it".
  - ".saggar/**"
