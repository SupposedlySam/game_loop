# The producer mutation sweep, moved OFF the interactive path, and swept SURGICALLY.
#
# The sweep neuters one producer function at a time and re-runs the whole suite to see which
# assertions actually notice. It is the only instrument this repo has for "does that test test
# anything", and it costs one full suite run per producer.
#
# WHAT IT COST (2026-11-12). Run nightly in full, it was twelve macOS shards of about two hours
# each, ~26 runner-hours a night, and it spent this account's whole monthly Actions budget halfway
# through November: $987 on this repo. The run history showed the same commit swept six nights
# running. The old note here said public repos get these runners free; the bill says otherwise
# for this account, so nothing below assumes it.
#
# SO EACH NIGHT SWEEPS ONLY WHAT CHANGED. A cheap Linux `plan` job finds the commit the last
# completed sweep ran on and asks the sweep which producers' own code differs since then
# (GAME_LOOP_SWEEP_CHANGED_SINCE, in list mode: no suite runs). Zero means no macOS job starts at
# all. Otherwise it starts one shard per eight producers, up to twelve.
#
# WHAT A CHANGED-ONLY SWEEP CANNOT SEE: a test weakened while its producer stayed the same. Only a
# FULL sweep finds that, so a full one runs on demand (Run workflow, full: true). It is not
# scheduled, because a scheduled full sweep is what the budget went on.
#
# WHY macOS. This harness reads `ps -Ao pid,args`, shells out to `open`, and resolves paths the way
# a Mac does. Every measurement behind these floors was taken on macOS, and a sweep that fails for
# platform reasons rather than coverage reasons is a sweep people learn to ignore.

name: mutation sweep (nightly, changed producers only)

on:
  schedule:
    # 08:00 UTC — roughly 1am Pacific / 3am Central, so a finding is waiting in the morning.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Sweep EVERY producer (about 26 macOS runner-hours), not just the changed ones"
        type: boolean
        default: false

# Least privilege: read the code and the run history, write one issue. Nothing here pushes.
permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  # A sweep still running when the next night arrives should finish, not be raced by a second one.
  group: mutation-sweep
  cancel-in-progress: false

jobs:
  plan:
    name: which producers changed
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      since: ${{ steps.plan.outputs.since }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # the base commit has to be in the clone to diff against it

      - name: count changed producers
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL: ${{ inputs.full || false }}
        run: |
          set -euo pipefail
          since=""
          if [ "$FULL" != "true" ]; then
            # The newest run of this workflow that actually swept (success or failure, not
            # cancelled or skipped) is the commit whose producers were last measured.
            since=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mutation-sweep.yml \
                      --branch main --status completed --limit 30 \
                      --json headSha,conclusion \
                      --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // ""')
            if [ -z "$since" ]; then
              echo "no earlier sweep to diff against; run it once with full: true to set a base."
              { echo "count=0"; echo "shards=[]"; echo "since="; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          listing=$(GAME_LOOP_SWEEP_LIST=1 GAME_LOOP_SWEEP_CHANGED_SINCE="$since" \
                    python3 test/mutation_sweep.py | tail -1)
          count=$(printf '%s' "$listing" | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          n=$(( count == 0 ? 0 : (count + 7) / 8 ))
          [ "$n" -gt 12 ] && n=12
          shards=$(python3 -c "import json; print(json.dumps(list(range(1, $n + 1))))")
          echo "since ${since:-'(full sweep)'}: $count producer(s) to sweep across $n shard(s)"
          printf '%s' "$listing" | python3 -c 'import json,sys; [print("  ", p) for p in json.load(sys.stdin)["producers"]]'
          { echo "count=$count"; echo "shards=$shards"; echo "since=$since"; } >> "$GITHUB_OUTPUT"

  sweep:
    name: sweep ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: macos-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false        # one shard's coverage loss must not hide the others'
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The sweep runs `git archive HEAD`, diffs against the base commit, and the suite makes
          # real git calls of its own.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run the sweep shard
        id: sweep
        env:
          GAME_LOOP_SWEEP_SHARD: "${{ matrix.shard }}/${{ strategy.job-total }}"
          GAME_LOOP_SWEEP_CHANGED_SINCE: ${{ needs.plan.outputs.since }}
          # These runners have 3 cores, and the `cpu - 2` default would sweep one at a time.
          GAME_LOOP_SWEEP_JOBS: "2"
        run: |
          set -o pipefail
          python3 test/mutation_sweep.py 2>&1 | tee "sweep-${{ matrix.shard }}.log"

      - name: keep the log either way
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.shard }}
          path: sweep-${{ matrix.shard }}.log
          retention-days: 14

  report:
    name: file an issue if anything regressed
    needs: [plan, sweep]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      # THE CLASSIFIER LIVES IN THE REPO, so the repo has to be here. This job had no checkout,
      # python could not open .github/sweep_report.py, and the step read that failure as "nothing
      # to file": every red night from mid-September to 2026-11-12 was reported as clean.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: logs

      - name: open ONE issue, and only if none is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          # The label has to exist before it can be filtered on or applied, and a fresh clone of
          # this repo has no labels but the defaults. Creating it is idempotent.
          gh label create mutation-sweep --repo "$GITHUB_REPOSITORY" \
             --color B60205 --description "the nightly producer mutation sweep is not clean" \
             2>/dev/null || true

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                       --label mutation-sweep --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "issue #$existing is already open for this; not filing another."
            exit 0
          fi

          # WHAT HAPPENED IS DECIDED FROM THE SHARD LOGS, NOT FROM THE JOB'S EXIT (#128): REGRESSED,
          # INCOMPLETE (a shard log missing) or INFRA (every log clean, job failed anyway). Exit 3
          # alone means clean; ANY other non-zero exit is the classifier failing, and fails here.
          expected=$(printf '%s' "$SHARDS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          set +e
          title=$(python3 .github/sweep_report.py logs "$expected" "${{ needs.sweep.result }}" "$RUN_URL")
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "nothing to file: every expected shard log is present and clean, and the job passed."
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "the classifier itself failed (exit $rc); not reporting a verdict it did not reach."
            exit "$rc"
          fi

          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --label mutation-sweep \
            --body-file body.md
